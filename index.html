<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>車牌查詢系統 PRO</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // 文青配色系統
                        'heritage-blue': '#4a5d6a', // 導航欄深藍灰
                        'sage-green': '#6b9080',    // 按鈕草綠
                        'sage-dark': '#557266',     // 按鈕深綠
                        'paper-white': '#fdfbf7',   // 背景米白
                        'warm-gray': '#a4ac86',     // 裝飾色
                        'muted-coral': '#e29578',   // 重置按鈕 (已移除功能，僅留色碼備用)
                    },
                    fontFamily: {
                        sans: ['"Microsoft JhengHei"', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #fdfbf7; /* 米白紙質感 */
        }
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: visible !important; }
        
        /* Toast 動畫 */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }
        .toast {
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
        }
        .toast.show {
            transform: translateX(0);
        }

        /* Loading Overlay 動畫 */
        #loading-overlay {
            transition: opacity 0.5s ease-in-out;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6b9080;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen pb-24 relative">

    <!-- Loading Overlay (同步畫面) -->
    <div id="loading-overlay" class="fixed inset-0 bg-paper-white z-[9999] flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <h2 id="loading-text" class="text-xl font-bold text-heritage-blue tracking-widest">正在連線 Google 資料庫...</h2>
        <p class="text-sm text-gray-500 mt-2">正在同步最新車輛資訊</p>
    </div>

    <!-- 導航欄 -->
    <nav class="bg-heritage-blue text-white shadow-md sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <!-- Icon: Database -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6 text-warm-gray"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                    <span class="font-bold text-lg tracking-widest">車牌查詢系統 PRO</span>
                </div>
                <div class="flex items-center gap-4 text-sm opacity-90">
                    <span id="syncStatus" class="hidden sm:block bg-sage-green px-3 py-1 rounded-full text-xs font-medium tracking-wide">資料已同步</span>
                    <span id="totalCount" class="font-mono">總數: 0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- 控制面板 -->
        <div class="flex flex-col md:flex-row gap-4 mb-8 justify-between items-start md:items-center">
            <!-- 搜尋框 -->
            <div class="relative w-full md:w-96 shadow-sm">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <!-- Icon: Search -->
                    <svg class="h-5 w-5 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </div>
                <input type="text" id="searchInput" 
                    class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-lg bg-white focus:ring-2 focus:ring-sage-green focus:border-sage-green outline-none transition text-gray-700"
                    placeholder="搜尋車牌、姓名或外觀...">
            </div>

            <!-- 按鈕區 -->
            <div class="flex gap-2 w-full md:w-auto">
                <button onclick="openModal()" class="flex-1 md:flex-none flex items-center justify-center gap-2 bg-sage-green hover:bg-sage-dark text-white px-6 py-3 rounded-lg shadow-md transition-colors font-medium tracking-wide">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    新增
                </button>
                <button onclick="fetchDataFromGAS()" title="強制同步" class="flex items-center justify-center gap-2 bg-white text-heritage-blue hover:bg-gray-50 border border-gray-200 px-4 py-3 rounded-lg shadow-sm transition-colors font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
                </button>
            </div>
        </div>

        <!-- 統計資訊 -->
        <div class="mb-6 border-b border-gray-200 pb-2 flex justify-between items-end">
            <h2 class="text-xl font-bold text-heritage-blue tracking-wide">查詢結果</h2>
            <span id="displayCount" class="text-sm text-gray-500">顯示 0 筆資料</span>
        </div>
        
        <div id="emptyMsg" class="hidden text-center py-12">
             <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gray-100 mb-4">
                <svg class="h-8 w-8 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
             </div>
             <p class="text-gray-500 font-medium">查無資料</p>
             <p class="text-sm text-gray-400 mt-1">請嘗試其他關鍵字</p>
        </div>

        <!-- 卡片容器 -->
        <div id="cardContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- JS 渲染內容 -->
        </div>

    </main>

    <!-- Modal (新增視窗) -->
    <div id="modal" class="modal fixed w-full h-full top-0 left-0 flex items-center justify-center opacity-0 pointer-events-none z-50">
        <div class="modal-overlay absolute w-full h-full bg-heritage-blue opacity-60 backdrop-blur-sm"></div>
        
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-xl shadow-2xl z-50 overflow-y-auto transform transition-all scale-95 duration-300">
            
            <div class="bg-heritage-blue px-6 py-4 flex justify-between items-center text-white">
                <p class="font-bold text-lg flex items-center gap-2 tracking-wide">新增資料</p>
                <div onclick="closeModal()" class="cursor-pointer z-50 hover:bg-white/10 rounded p-1 transition">
                    <svg class="fill-current text-white" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
                        <path d="M14.53 4.53l-1.06-1.06L9 7.94 4.53 3.47 3.47 4.53 7.94 9l-4.47 4.47 1.06 1.06L9 10.06l4.47 4.47 1.06-1.06L10.06 9z"></path>
                    </svg>
                </div>
            </div>

            <div class="modal-content py-6 text-left px-6">
                <form id="addForm" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">支會 (Group)</label>
                            <input type="text" id="inputBranch" required placeholder="例如: 蘆竹" class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg focus:ring-2 focus:ring-sage-green focus:border-sage-green outline-none transition">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">姓名 (Name)</label>
                            <input type="text" id="inputName" required placeholder="姓名" class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg focus:ring-2 focus:ring-sage-green focus:border-sage-green outline-none transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">車牌號碼 (Plate)</label>
                        <input type="text" id="inputPlate" required placeholder="例如: ABC-1234" class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg font-mono uppercase focus:ring-2 focus:ring-sage-green focus:border-sage-green outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">聯絡電話 (Phone)</label>
                        <input type="tel" id="inputContact" placeholder="09xx-xxx-xxx" class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg focus:ring-2 focus:ring-sage-green focus:border-sage-green outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">外觀備註 (Note)</label>
                        <input type="text" id="inputAppearance" placeholder="例如: 紅色 Toyota" class="w-full bg-gray-50 border border-gray-200 p-2.5 rounded-lg focus:ring-2 focus:ring-sage-green focus:border-sage-green outline-none transition">
                    </div>

                    <div class="flex justify-end pt-4 gap-3">
                        <button type="button" onclick="closeModal()" class="px-5 py-2.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition font-medium">取消</button>
                        <button type="submit" class="px-5 py-2.5 bg-sage-green text-white rounded-lg hover:bg-sage-dark shadow-md transition font-medium">儲存資料</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- JavaScript 邏輯 -->
    <script>
        // ============================================
        // 設定區域：請在此填入您的 Google Apps Script 網址
        // ============================================
        const GAS_API_URL = ''; // 例如: https://script.google.com/macros/s/XXXXX/exec

        // ============================================
        // 內建備用資料庫 (CSV Raw String)
        // 請在此處更新您的資料！
        // 格式：序號,支會,姓名,車牌,電話,備註
        // ============================================
        const SYSTEM_BACKUP_CSV = `
1,龜山,譚若陽,ABQ-9007,N/A,紅色日產
2,龜山,陳誠二,AKH-9199,0986-883-058,深灰日產休旅
3,龜山,廖健棠,AKT-3192,0915-060-265,銀色三菱休旅
4,龜山,郭啟任,ALL-8708,0910-965-753,灰色豐田休旅
5,龜山,張㨗勛,AUD-2135,0963-468-527,銀色三菱
6,龜山,游添義,AUN-7603,0937-111-324,銀色三菱休旅
7,龜山,劉炳志,AVS-5620,0956-363-089,鐵灰色豐田
8,龜山,呂柏頤,AWL-2333,0966-750-019,藍色福特
9,龜山,依涵女兒,AXQ-8930,N/A,黑色豐田休旅
10,龜山,邱秀蓮,AXX-8513,0937-719-972,灰色豐田
11,龜山,蘇哲偉,AXZ-5603,0922-302-386,黑色三菱
58,蘆竹,張晉國,BXR-9306,0908-576-852
60,桃園,劉承維,BNZ-3279,0972-093-335
61,蘆竹,范馥麟,ANC-0317,0983-567-317
62,蘆竹,陳曄,BNY-2233,0910-151-577,黑色KIA
63,蘆竹,童聿銓,BLK-6270,0970-081-011
64,蘆竹,周羽信,AVS-1219,0928-107-070
65,蘆竹,"莊清耀\n莊邵瑋",AGT-1201,"0922-543-599\n0920-622-460"
87,蘆竹,"莊清耀\n林友友",BLR-0033,"0922-543-589\n0922-622-460",白色賓士
71,蘆竹,"陳佑安\n張嘉恬",AXA-3305,"0986-989-947\n0978-358-561"
97,蘆竹,"呂憲聰\n游芷嫻",0669-KU,"0970-268-303\n0970-055"
        `;

        const STORAGE_KEY = 'carPlateSystemData_PRO';
        let carData = [];

        // --- 初始化 & 同步邏輯 ---
        function init() {
            // 嘗試讀取本地資料，但優先嘗試 GAS 同步
            fetchDataFromGAS();
        }

        // 從 GAS 獲取資料
        async function fetchDataFromGAS() {
            showLoading(true);
            const statusEl = document.getElementById('syncStatus');

            if (!GAS_API_URL) {
                console.warn("GAS URL 未設定，切換至本地/備份資料模式");
                loadLocalOrBackup();
                showLoading(false);
                statusEl.textContent = "離線模式";
                statusEl.className = "bg-gray-500 px-3 py-1 rounded-full text-xs font-medium tracking-wide text-white";
                showToast('未設定 GAS 網址，使用備份資料', 'info');
                return;
            }

            try {
                const response = await fetch(GAS_API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const jsonMatrix = await response.json(); // 預期接收二維陣列 (Matrix)
                
                // 確認是否為陣列
                if (!Array.isArray(jsonMatrix)) throw new Error('Data format error');

                console.log("GAS 同步成功，開始矩陣迴圈處理...");
                processMatrixData(jsonMatrix);
                
                statusEl.textContent = "雲端已同步";
                statusEl.className = "bg-sage-green px-3 py-1 rounded-full text-xs font-medium tracking-wide text-white";
                showToast('雲端資料同步完成', 'success');

            } catch (error) {
                console.error("GAS Sync Error:", error);
                showToast('雲端同步失敗，切換至離線資料', 'error');
                statusEl.textContent = "同步失敗";
                statusEl.className = "bg-red-500 px-3 py-1 rounded-full text-xs font-medium tracking-wide text-white";
                loadLocalOrBackup();
            } finally {
                showLoading(false);
            }
        }

        // 矩陣迴圈處理 (Matrix Loop Processing)
        // 假設 GAS 回傳資料格式: [[序號, 支會, 姓名, 車牌, 電話, 備註], ...]
        function processMatrixData(matrix) {
            const processedData = [];
            
            // 矩陣迴圈 (Loop through matrix rows)
            matrix.forEach((row, index) => {
                // 基本過濾：如果該行資料不足，或是標題列，則跳過
                // 假設第4欄是車牌，如果包含 "車牌" 字樣則視為標題
                if (!Array.isArray(row) || row.length < 4) return;
                const plateVal = (row[3] || "").toString();
                if (plateVal.includes("車牌") || plateVal.includes("Plate")) return;

                // 資料映射 (Mapping)
                // 索引對照: 0=ID, 1=Branch, 2=Name, 3=Plate, 4=Contact, 5=Appearance
                const item = {
                    id: Date.now() + index, // 生成唯一 ID (或使用 row[0])
                    branch: row[1] || "未分類",
                    name: row[2] || "未知",
                    plate: plateVal.toUpperCase().trim(),
                    contact: row[4] ? row[4].toString() : "N/A",
                    appearance: row[5] || "一般"
                };
                processedData.push(item);
            });

            carData = processedData;
            saveAndRender();
        }

        function loadLocalOrBackup() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    carData = JSON.parse(stored);
                    console.log("載入 LocalStorage 快取資料");
                } catch (e) {
                    parseBackupCSV();
                }
            } else {
                parseBackupCSV();
            }
            render();
        }

        // 解析備份 CSV (舊邏輯保留作為 Fallback)
        function parseBackupCSV() {
            console.log("載入內建備份資料");
            const raw = SYSTEM_BACKUP_CSV.trim();
            const rows = [];
            let currentRow = [];
            let currentCell = '';
            let inQuotes = false;

            // CSV Parsing Loop
            for (let i = 0; i < raw.length; i++) {
                const char = raw[i];
                const nextChar = raw[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        currentCell += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    currentRow.push(currentCell.trim());
                    currentCell = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (currentCell || currentRow.length > 0) {
                        currentRow.push(currentCell.trim());
                        rows.push(currentRow);
                    }
                    currentRow = [];
                    currentCell = '';
                    if (char === '\r' && nextChar === '\n') i++;
                } else {
                    currentCell += char;
                }
            }
            if (currentCell || currentRow.length > 0) {
                currentRow.push(currentCell.trim());
                rows.push(currentRow);
            }

            carData = rows.map((cols, index) => {
                if (cols.length < 4) return null; 
                return {
                    id: Date.now() + index,
                    branch: cols[1] || "未分類",
                    name: cols[2] || "未知",
                    plate: (cols[3] || "無車牌").toUpperCase(),
                    contact: cols[4] || "N/A",
                    appearance: cols[5] || "一般"
                };
            }).filter(item => item !== null);

            saveAndRender();
        }

        // --- 渲染 (Render) 邏輯 ---
        function render() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const cardContainer = document.getElementById('cardContainer');
            const displayCount = document.getElementById('displayCount');
            const totalCount = document.getElementById('totalCount');
            const emptyMsg = document.getElementById('emptyMsg');

            // 無論搜尋狀態為何，總是更新總數
            totalCount.textContent = `總數: ${carData.length}`;

            // 0. 若搜尋欄為空，清空結果並返回
            if (!searchTerm) {
                cardContainer.innerHTML = `
                    <div class="col-span-1 md:col-span-2 lg:col-span-3 text-center py-20 opacity-50">
                        <svg class="mx-auto h-16 w-16 text-gray-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        <p class="text-xl text-gray-400 font-light tracking-widest">請輸入關鍵字開始查詢</p>
                    </div>
                `;
                displayCount.textContent = ''; // 隱藏顯示筆數
                emptyMsg.classList.add('hidden');
                return;
            }

            // 1. 篩選資料
            const filtered = carData.filter(item => 
                (item.name || "").toLowerCase().includes(searchTerm) ||
                (item.plate || "").toLowerCase().includes(searchTerm) ||
                (item.branch || "").includes(searchTerm) ||
                (item.contact || "").includes(searchTerm) ||
                (item.appearance || "").includes(searchTerm)
            );

            // 2. 更新統計
            displayCount.textContent = `顯示 ${filtered.length} 筆資料`;
            
            if (filtered.length === 0 && carData.length > 0) {
                emptyMsg.classList.remove('hidden');
                cardContainer.innerHTML = '';
            } else {
                emptyMsg.classList.add('hidden');
                
                // 3. 渲染卡片 (已移除刪除按鈕)
                cardContainer.innerHTML = filtered.map(item => `
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-lg hover:-translate-y-1 transition-all duration-300 group relative">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3">
                                <span class="px-3 py-1 text-xs font-bold rounded-full bg-slate-100 text-heritage-blue tracking-wide">${item.branch}</span>
                            </div>
                        </div>
                        
                        <div class="mb-5 text-center">
                            <h3 class="text-xl font-bold text-gray-800 mb-1 tracking-tight">${item.name}</h3>
                            <div class="inline-block bg-heritage-blue/10 px-4 py-1.5 rounded-lg mt-2">
                                <span class="font-mono font-bold text-2xl text-heritage-blue tracking-widest">${item.plate}</span>
                            </div>
                        </div>

                        <div class="space-y-3 border-t border-gray-100 pt-4">
                            <div class="flex items-start gap-3 text-sm text-gray-600">
                                <span class="text-lg opacity-70">🚙</span>
                                <span class="py-0.5 font-medium">${item.appearance}</span>
                            </div>
                            <div class="flex items-start gap-3 text-sm text-gray-600">
                                <span class="text-lg opacity-70">📞</span>
                                <div class="flex flex-col">
                                    ${formatContact(item.contact)}
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        // 處理多行聯絡資訊
        function formatContact(contactStr) {
            if (!contactStr || contactStr === "N/A") return '<span class="text-gray-400 py-0.5">未提供</span>';
            // 將 \n 轉為 <br> 並加上連結
            return contactStr.split(/\n|\\n/).map(num => {
                const cleanNum = num.trim();
                return `<a href="tel:${cleanNum}" class="font-medium text-sage-green hover:text-sage-dark hover:underline py-0.5 block">${cleanNum}</a>`;
            }).join('');
        }

        // --- UI 控制 ---
        function showLoading(show) {
            const overlay = document.getElementById('loading-overlay');
            if (show) {
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.style.opacity = '1', 10);
            } else {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.classList.add('hidden'), 500);
            }
        }

        // --- 事件監聽 ---
        document.getElementById('searchInput').addEventListener('input', render);
        
        document.getElementById('addForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                branch: document.getElementById('inputBranch').value,
                name: document.getElementById('inputName').value,
                plate: document.getElementById('inputPlate').value.toUpperCase(),
                contact: document.getElementById('inputContact').value || "N/A",
                appearance: document.getElementById('inputAppearance').value || "一般"
            };
            
            carData = [newItem, ...carData];
            saveAndRender();
            closeModal();
            showToast('新增成功！(僅儲存於本地)', 'success');
            e.target.reset();
        });

        // --- 功能函數 ---

        function saveAndRender() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(carData));
            render();
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgColor = 'bg-heritage-blue';
            let icon = '';
            if (type === 'success') {
                bgColor = 'bg-sage-green';
            } else if (type === 'error') {
                bgColor = 'bg-red-500';
            }
            
            toast.className = `toast ${bgColor} text-white px-6 py-3 rounded-lg shadow-xl mb-3 flex items-center gap-2 font-medium tracking-wide`;
            toast.innerHTML = `<span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        const modal = document.getElementById('modal');
        function openModal() {
            modal.classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
        }
        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.body.classList.remove('modal-active');
        }

        // 啟動
        init();

    </script>
</body>
</html>
